<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>企业安全教育培训考试系统</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .header h1 { color: white; font-size: 1.5rem; }
        .admin-btn { background: #f59e0b; color: white; padding: 8px 20px; border-radius: 30px; cursor: pointer; border: none; }
        .logout-btn { background: #ef4444; color: white; padding: 8px 20px; border-radius: 30px; cursor: pointer; border: none; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .tab.active { background: white; color: #1e3c72; }
        
        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 15px; flex-wrap: wrap; }
        .card-header h2 { color: #1e3c72; }
        
        .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; margin: 2px; }
        .btn-primary { background: #1e3c72; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #e5e7eb; border-radius: 8px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f8fafc; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 20px; padding: 25px; max-width: 500px; width: 90%; }
        
        .question-card { background: #f8fafc; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .options { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .option { display: flex; align-items: center; gap: 12px; padding: 12px; background: white; border-radius: 10px; cursor: pointer; border: 2px solid transparent; }
        .option:hover { border-color: #1e3c72; background: #eff6ff; }
        .progress-bar { width: 100%; height: 10px; background: #e5e7eb; border-radius: 10px; overflow: hidden; margin: 15px 0; }
        .progress-fill { height: 100%; background: #1e3c72; transition: width 0.3s; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 15px; border-radius: 15px; text-align: center; }
        .stat-number { font-size: 28px; font-weight: bold; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        @media (max-width: 768px) { .card { padding: 15px; } .tab { padding: 6px 12px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏭 企业安全教育培训考试系统</h1>
        <div>
            <button class="admin-btn" id="adminBtn">👑 管理员登录</button>
            <button class="logout-btn" id="logoutBtn" style="display:none;">退出</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="exam">📝 每日考试</button>
        <button class="tab" data-tab="practice">📖 练习模式</button>
        <button class="tab" data-tab="manage">👥 员工管理</button>
        <button class="tab" data-tab="questionBank">📚 题库管理</button>
        <button class="tab" data-tab="records">📊 成绩记录</button>
        <button class="tab" data-tab="stats">📈 统计分析</button>
        <button class="tab admin-only" data-tab="admin" style="display:none;">⚙️ 系统管理</button>
    </div>

    <!-- 每日考试 -->
    <div id="exam" class="tab-content active">
        <div class="card">
            <div id="verifyPanel">
                <h2>📅 每日安全考试</h2>
                <p style="color:#666; margin-bottom:15px;">每天仅可考试一次</p>
                <div class="form-group"><label>工号</label><input type="text" id="empId" placeholder="请输入工号"></div>
                <div class="form-group"><label>姓名</label><input type="text" id="empName" placeholder="请输入姓名"></div>
                <button class="btn btn-primary" id="startExamBtn" style="width:100%; padding:12px;">开始考试</button>
            </div>
            <div id="examPanel" style="display:none">
                <h3 id="welcomeMsg"></h3>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                    <span>第 <span id="qIndex">1</span> / <span id="qTotal">0</span> 题</span>
                    <span>剩余: <span id="timer">30:00</span></span>
                </div>
                <div id="questionArea"></div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn" id="prevBtn" style="background:#e5e7eb">上一题</button>
                    <button class="btn btn-primary" id="nextBtn">下一题</button>
                    <button class="btn btn-success" id="submitBtn" style="display:none">提交</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 练习模式 -->
    <div id="practice" class="tab-content">
        <div class="card">
            <div id="practiceVerifyPanel">
                <h2>📖 练习模式</h2>
                <p style="color:#666; margin-bottom:15px;">不限次数，不计入成绩</p>
                <div class="form-group"><label>姓名（选填）</label><input type="text" id="practiceName" placeholder="可不填"></div>
                <div class="form-group"><label>练习数量</label><select id="practiceCount"><option value="5">5题</option><option value="10" selected>10题</option><option value="20">20题</option></select></div>
                <button class="btn btn-primary" id="startPracticeBtn" style="width:100%; padding:12px;">开始练习</button>
            </div>
            <div id="practicePanel" style="display:none">
                <h3 id="practiceWelcomeMsg"></h3>
                <div class="progress-bar"><div class="progress-fill" id="practiceProgressFill"></div></div>
                <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                    <span>第 <span id="practiceQIndex">1</span> / <span id="practiceQTotal">0</span> 题</span>
                    <span>正确: <span id="practiceCorrectCount">0</span></span>
                </div>
                <div id="practiceQuestionArea"></div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn" id="practicePrevBtn" style="background:#e5e7eb">上一题</button>
                    <button class="btn btn-primary" id="practiceNextBtn">下一题</button>
                    <button class="btn btn-success" id="practiceViewResultBtn" style="display:none">查看结果</button>
                </div>
            </div>
            <div id="practiceResultPanel" style="display:none">
                <h3>练习结果</h3>
                <div id="practiceResultContent"></div>
                <button class="btn btn-primary" id="practiceAgainBtn" style="margin-top:20px">再练一次</button>
            </div>
        </div>
    </div>

    <!-- 员工管理 -->
    <div id="manage" class="tab-content">
        <div class="card">
            <div class="card-header"><h2>员工管理</h2><button class="btn btn-primary" id="importEmpBtn">导入员工</button></div>
            <div class="table-container"><table><thead><tr><th>工号</th><th>姓名</th><th>部门</th><th>今日状态</th><th>操作</th></tr></thead><tbody id="employeeTable"></tbody></table></div>
        </div>
    </div>

    <!-- 题库管理 -->
    <div id="questionBank" class="tab-content">
        <div class="card">
            <div class="card-header"><h2>题库管理</h2><button class="btn btn-primary" id="importQuesBtn">导入题库</button></div>
            <div class="table-container"><table><thead><tr><th>题目</th><th>选项</th><th>答案</th><th>操作</th></tr></thead><tbody id="questionTable"></tbody></table></div>
        </div>
    </div>

    <!-- 成绩记录 -->
    <div id="records" class="tab-content">
        <div class="card">
            <div class="card-header"><h2>成绩记录</h2><button class="btn btn-success" id="exportRecordBtn">导出成绩</button></div>
            <div class="table-container"><table><thead><tr><th>日期</th><th>姓名</th><th>得分</th><th>详情</th></tr></thead><tbody id="recordTable"></tbody></table></div>
        </div>
    </div>

    <!-- 统计分析 -->
    <div id="stats" class="tab-content">
        <div class="card">
            <div class="card-header"><h2>统计分析</h2></div>
            <div class="stats-grid" id="statsGrid"></div>
        </div>
    </div>

    <!-- 系统管理 -->
    <div id="admin" class="tab-content">
        <div class="card">
            <div class="card-header"><h2>系统设置</h2></div>
            <div class="form-group"><label>每日抽题数量</label><input type="number" id="dailyCount" value="10"></div>
            <div class="form-group"><label>考试时间(分钟)</label><input type="number" id="dailyTime" value="30"></div>
            <button class="btn btn-primary" id="saveSettingsBtn">保存设置</button>
            <hr style="margin:20px 0">
            <div class="form-group"><label>修改密码</label><input type="password" id="newPwd" placeholder="新密码"></div>
            <button class="btn btn-primary" id="changePwdBtn">修改密码</button>
            <hr style="margin:20px 0">
            <button class="btn btn-danger" id="clearDataBtn">清空所有数据</button>
            <button class="btn btn-warning" id="resetDailyBtn">重置今日考试状态</button>
        </div>
    </div>
</div>

<!-- 导入模态框 -->
<div id="importModal" class="modal">
    <div class="modal-content">
        <h3 id="importTitle">导入数据</h3>
        <input type="file" id="importFile" accept=".json,.xlsx,.xls">
        <div style="margin-top:15px"><button class="btn btn-primary" id="confirmImportBtn">导入</button><button class="btn" id="closeModalBtn">取消</button></div>
    </div>
</div>

<div id="adminLoginModal" class="modal">

        <button class="btn" id="closeAdminModalBtn">取消</button>
        <p style="margin-top:10px; color:#999">默认密码: admin123</p>
    </div>
</div>

        { id: 4, text: "进入施工现场必须佩戴安全帽。", options: ["正确", "错误"], answer: 0 },
        { id: 5, text: "安全生产方针是什么？", options: ["安全第一，预防为主", "效率第一", "质量第一", "效益第一"], answer: 0 }
    ];
    
    let examRecords = [];
    let dailyStatus = {};
    let isAdmin = false;
    let settings = { dailyCount: 10, dailyTime: 30 };
    let admins = [{ username: "admin", password: "admin123" }];
    let currentAdmin = null;
    
    let currentExam = { emp: null, questions: [], answers: [], curIndex: 0, timer: null };
    let currentPractice = { name: "", questions: [], answers: [], curIndex: 0, correctCount: 0 };
    let importType = "employee";
    
    function getToday() { return new Date().toISOString().slice(0,10); }
    function hasTakenToday(empId) { return dailyStatus[`${getToday()}_${empId}`] === true; }
    function markTaken(empId) { dailyStatus[`${getToday()}_${empId}`] = true; localStorage.setItem('dailyStatus', JSON.stringify(dailyStatus)); }
    
    function saveData() {
        localStorage.setItem('employees', JSON.stringify(employees));
        localStorage.setItem('questions', JSON.stringify(questions));
        localStorage.setItem('examRecords', JSON.stringify(examRecords));
        localStorage.setItem('dailyStatus', JSON.stringify(dailyStatus));
        localStorage.setItem('settings', JSON.stringify(settings));
        localStorage.setItem('admins', JSON.stringify(admins));
        if (currentAdmin) localStorage.setItem('currentAdmin', currentAdmin);
    }
    
    function loadData() {
        let stored = localStorage.getItem('employees');
        if (stored) employees = JSON.parse(stored);
        stored = localStorage.getItem('questions');
        if (stored) questions = JSON.parse(stored);
        stored = localStorage.getItem('examRecords');
        if (stored) examRecords = JSON.parse(stored);
        stored = localStorage.getItem('dailyStatus');
        if (stored) dailyStatus = JSON.parse(stored);
        stored = localStorage.getItem('settings');
        if (stored) settings = JSON.parse(stored);
        stored = localStorage.getItem('admins');
        if (stored) admins = JSON.parse(stored);
        currentAdmin = localStorage.getItem('currentAdmin');
        if (currentAdmin) isAdmin = true;
        
        document.getElementById('dailyCount').value = settings.dailyCount;
        document.getElementById('dailyTime').value = settings.dailyTime;
        
        if (isAdmin) {
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'inline-block');
            document.getElementById('adminBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline-block';
        }
    }
    
    function getRandomQuestions(count) {
        let shuffled = [...questions];
        for (let i = shuffled.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, Math.min(count, shuffled.length));
    }
    
    function renderEmployees() {
        let html = '';
        employees.forEach(emp => {
            let status = hasTakenToday(emp.id) ? '✅ 已完成' : '⏳ 未考试';
            html += `<tr><td>${emp.id}</td><td>${emp.name}</td><td>${emp.dept}</td><td>${status}</td><td><button class="btn btn-danger" onclick="deleteEmployee('${emp.id}')">删除</button></td></tr>`;
        });
        document.getElementById('employeeTable').innerHTML = html;
    }
    
    function renderQuestions() {
        let html = '';
        questions.forEach((q, idx) => {
            let optText = q.options.join(' | ');
            let answer = String.fromCharCode(65 + q.answer);
            html += `<tr><td>${q.text}</td><td>${optText}</td><td>${answer}</td><td><button class="btn btn-danger" onclick="deleteQuestion(${q.id})">删除</button></td></tr>`;
        });
        document.getElementById('questionTable').innerHTML = html;
    }
    
    function renderRecords() {
        let html = '';
        examRecords.forEach(r => {
            html += `<tr><td>${r.date}</td><td>${r.name}</td><td>${r.score.toFixed(1)}分</td><td>${r.correct}/${r.total}</td></tr>`;
        });
        document.getElementById('recordTable').innerHTML = html;
        
        let total = examRecords.length;
        let avg = total > 0 ? examRecords.reduce((s,r)=>s+r.score,0)/total : 0;
        let pass = examRecords.filter(r=>r.score>=60).length;
        let passRate = total > 0 ? (pass/total*100).toFixed(1) : 0;
        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><div class="stat-number">${employees.length}</div><div>总员工</div></div>
            <div class="stat-card"><div class="stat-number">${total}</div><div>考试次数</div></div>
            <div class="stat-card"><div class="stat-number">${avg.toFixed(1)}</div><div>平均分</div></div>
            <div class="stat-card"><div class="stat-number">${passRate}%</div><div>及格率</div></div>
        `;
    }
    
    function startExam() {
        let id = document.getElementById('empId').value.trim();
        let name = document.getElementById('empName').value.trim();
        let emp = employees.find(e => e.id === id && e.name === name);
        if (!emp) { alert("验证失败！工号或姓名不正确"); return; }
        if (hasTakenToday(id)) { alert("今日已完成考试！"); return; }
        if (questions.length === 0) { alert("题库为空！"); return; }
        
        let examQuestions = getRandomQuestions(settings.dailyCount);
        currentExam = { emp: emp, questions: examQuestions, answers: new Array(examQuestions.length).fill(null), curIndex: 0, timer: null };
        
        document.getElementById('verifyPanel').style.display = 'none';
        document.getElementById('examPanel').style.display = 'block';
        document.getElementById('welcomeMsg').innerHTML = `欢迎 ${emp.name}，共${examQuestions.length}题`;
        document.getElementById('qTotal').innerText = examQuestions.length;
        
        let timeLeft = settings.dailyTime * 60;
        let timerInterval = setInterval(() => {
            let min = Math.floor(timeLeft/60);
            let sec = timeLeft%60;
            document.getElementById('timer').innerText = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
            if (timeLeft <= 0) { clearInterval(timerInterval); alert("时间到！"); submitExam(); }
            timeLeft--;
        }, 1000);
        currentExam.timer = timerInterval;
        renderQuestion();
    }
    
    function renderQuestion() {
        let q = currentExam.questions[currentExam.curIndex];
        let html = `<div class="question-card"><h3>${currentExam.curIndex+1}. ${q.text}</h3><div class="options">`;
        q.options.forEach((opt, idx) => {
            let checked = currentExam.answers[currentExam.curIndex] === idx ? 'checked' : '';
            html += `<label class="option"><input type="radio" name="q" value="${idx}" ${checked} onclick="saveAnswer(${idx})"> ${String.fromCharCode(65+idx)}. ${opt}</label>`;
        });
        html += `</div></div>`;
        document.getElementById('questionArea').innerHTML = html;
        document.getElementById('qIndex').innerText = currentExam.curIndex + 1;
        document.getElementById('progressFill').style.width = `${((currentExam.curIndex+1)/currentExam.questions.length)*100}%`;
        
        let isLast = currentExam.curIndex === currentExam.questions.length - 1;
        document.getElementById('nextBtn').style.display = isLast ? 'none' : 'inline-block';
        document.getElementById('submitBtn').style.display = isLast ? 'inline-block' : 'none';
    }
    
    window.saveAnswer = function(ans) { currentExam.answers[currentExam.curIndex] = ans; }
    window.nextQuestion = function() { if (currentExam.curIndex < currentExam.questions.length-1) { currentExam.curIndex++; renderQuestion(); } }
    window.prevQuestion = function() { if (currentExam.curIndex > 0) { currentExam.curIndex--; renderQuestion(); } }
    
    function submitExam() {
        if (currentExam.timer) clearInterval(currentExam.timer);
        let correct = 0;
        currentExam.answers.forEach((ans, idx) => {
            if (ans !== null && ans === currentExam.questions[idx].answer) correct++;
        });
        let score = (correct / currentExam.questions.length) * 100;
        examRecords.push({ date: getToday(), name: currentExam.emp.name, score: score, correct: correct, total: currentExam.questions.length });
        markTaken(currentExam.emp.id);
        saveData();
        alert(`考试完成！得分：${score.toFixed(1)}分`);
        
        document.getElementById('verifyPanel').style.display = 'block';
        document.getElementById('examPanel').style.display = 'none';
        document.getElementById('empId').value = '';
        document.getElementById('empName').value = '';
        renderEmployees();
        renderRecords();
    }
    
    function startPractice() {
        let name = document.getElementById('practiceName').value.trim() || "练习者";
        let count = parseInt(document.getElementById('practiceCount').value);
        if (questions.length === 0) { alert("题库为空！"); return; }
        
        let practiceQuestions = getRandomQuestions(count);
        currentPractice = { name: name, questions: practiceQuestions, answers: new Array(practiceQuestions.length).fill(null), curIndex: 0, correctCount: 0 };
        
        document.getElementById('practiceVerifyPanel').style.display = 'none';
        document.getElementById('practicePanel').style.display = 'block';
        document.getElementById('practiceWelcomeMsg').innerHTML = `练习模式 - ${name}`;
        document.getElementById('practiceQTotal').innerText = practiceQuestions.length;
        renderPracticeQuestion();
    }
    
    function renderPracticeQuestion() {
        let q = currentPractice.questions[currentPractice.curIndex];
        let html = `<div class="question-card"><h3>${currentPractice.curIndex+1}. ${q.text}</h3><div class="options">`;
        q.options.forEach((opt, idx) => {
            let checked = currentPractice.answers[currentPractice.curIndex] === idx ? 'checked' : '';
            html += `<label class="option"><input type="radio" name="p" value="${idx}" ${checked} onclick="savePracticeAnswer(${idx})"> ${String.fromCharCode(65+idx)}. ${opt}</label>`;
        });
        html += `</div></div>`;
        document.getElementById('practiceQuestionArea').innerHTML = html;
        document.getElementById('practiceQIndex').innerText = currentPractice.curIndex + 1;
        document.getElementById('practiceProgressFill').style.width = `${((currentPractice.curIndex+1)/currentPractice.questions.length)*100}%`;
        
        let isLast = currentPractice.curIndex === currentPractice.questions.length - 1;
        document.getElementById('practiceNextBtn').style.display = isLast ? 'none' : 'inline-block';
        document.getElementById('practiceViewResultBtn').style.display = isLast ? 'inline-block' : 'none';
    }
    
    window.savePracticeAnswer = function(ans) {
        currentPractice.answers[currentPractice.curIndex] = ans;
        let correct = 0;
        currentPractice.answers.forEach((a, idx) => { if (a !== null && a === currentPractice.questions[idx].answer) correct++; });
        currentPractice.correctCount = correct;
        document.getElementById('practiceCorrectCount').innerText = correct;
    }
    window.nextPractice = function() { if (currentPractice.curIndex < currentPractice.questions.length-1) { currentPractice.curIndex++; renderPracticeQuestion(); } }
    window.prevPractice = function() { if (currentPractice.curIndex > 0) { currentPractice.curIndex--; renderPracticeQuestion(); } }
    
    function showPracticeResult() {
        let correct = currentPractice.correctCount;
        let total = currentPractice.questions.length;
        let score = (correct/total)*100;
        
        let html = `<div style="text-align:center; padding:20px;"><div style="font-size:48px;">${score>=80?'🎉':score>=60?'👍':'💪'}</div>`;
        html += `<div style="font-size:24px;">得分：${score.toFixed(1)}分</div><div>正确：${correct}/${total}</div></div>`;
        
        let wrongs = [];
        currentPractice.answers.forEach((ans, idx) => {
            if (ans !== null && ans !== currentPractice.questions[idx].answer) {
                wrongs.push({ text: currentPractice.questions[idx].text, user: currentPractice.questions[idx].options[ans], correct: currentPractice.questions[idx].options[currentPractice.questions[idx].answer] });
            }
        });
        if (wrongs.length > 0) {
            html += `<h4>错题解析：</h4>`;
            wrongs.forEach(w => { html += `<div style="background:#fee; padding:10px; margin:10px 0; border-radius:8px;"><div>${w.text}</div><div style="color:#c00;">❌ 您的答案：${w.user}</div><div style="color:#0a0;">✅ 正确答案：${w.correct}</div></div>`; });
        }
        document.getElementById('practiceResultContent').innerHTML = html;
        document.getElementById('practicePanel').style.display = 'none';
        document.getElementById('practiceResultPanel').style.display = 'block';
    }
    
    function resetPractice() {
        document.getElementById('practiceVerifyPanel').style.display = 'block';
        document.getElementById('practicePanel').style.display = 'none';
        document.getElementById('practiceResultPanel').style.display = 'none';
        document.getElementById('practiceName').value = '';
    }
    
    function showImportModal(type) { importType = type; document.getElementById('importTitle').innerHTML = type === 'employee' ? '导入员工名单' : '导入题库'; document.getElementById('importModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('importModal').style.display = 'none'; }
    function closeAdminModal() { document.getElementById('adminLoginModal').style.display = 'none'; }
    
    function doImport() {
        let file = document.getElementById('importFile').files[0];
        if (!file) { alert("请选择文件"); return; }
        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let data;
                if (file.name.endsWith('.json')) { data = JSON.parse(e.target.result); }
                else { let workbook = XLSX.read(e.target.result, {type:'array'}); let sheet = workbook.Sheets[workbook.SheetNames[0]]; data = XLSX.utils.sheet_to_json(sheet); }
                if (importType === 'employee') {
                    let newEmps = data.map((row,i) => ({ id: row.id || row.工号 || String(i+1).padStart(3,'0'), name: row.name || row.姓名, dept: row.dept || row.部门 || '' })).filter(e => e.name);
                    employees.push(...newEmps);
                } else {
                    let newQuestions = data.map((row,idx) => {
                        let opts = [row.A, row.B, row.C, row.D];
                        if (row.选项A) opts = [row.选项A, row.选项B, row.选项C, row.选项D];
                        let answer = row.答案 || row.answer;
                        let ansIdx = answer === 'A' ? 0 : answer === 'B' ? 1 : answer === 'C' ? 2 : answer === 'D' ? 3 : (answer === '正确' ? 0 : answer === '错误' ? 1 : 0);
                        return { id: Date.now()+idx, text: row.题目 || row.text, options: opts, answer: ansIdx };
                    }).filter(q => q.text);
                    questions.push(...newQuestions);
                }
                saveData();
                renderEmployees(); renderQuestions();
                alert("导入成功！");
                closeModal();
            } catch(err) { alert("导入失败：" + err.message); }
        };
        if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) reader.readAsArrayBuffer(file);
        else reader.readAsText(file);
    }
    
    function exportRecords() { let blob = new Blob([JSON.stringify(examRecords,null,2)], {type:'application/json'}); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '考试成绩.json'; a.click(); }
    window.deleteEmployee = function(id) { employees = employees.filter(e=>e.id!==id); saveData(); renderEmployees(); renderRecords(); }
    window.deleteQuestion = function(id) { questions = questions.filter(q=>q.id!==id); saveData(); renderQuestions(); }
    function clearAllData() { if(confirm("清空所有数据？")) { employees = []; questions = []; examRecords = []; dailyStatus = {}; saveData(); renderEmployees(); renderQuestions(); renderRecords(); alert("已清空"); } }
    function resetDaily() { dailyStatus = {}; saveData(); renderEmployees(); alert("已重置今日状态"); }
    function saveSettings() { settings.dailyCount = parseInt(document.getElementById('dailyCount').value); settings.dailyTime = parseInt(document.getElementById('dailyTime').value); saveData(); alert("设置已保存"); }
    function changePassword() { let pwd = document.getElementById('newPwd').value; if(!pwd) return; admins[0].password = pwd; saveData(); alert("密码已修改"); document.getElementById('newPwd').value = ''; }
    function adminLogin() { let pwd = document.getElementById('adminPwd').value; if(pwd === admins[0].password) { isAdmin=true; currentAdmin="admin"; localStorage.setItem('currentAdmin','admin'); document.querySelectorAll('.admin-only').forEach(el=>el.style.display='inline-block'); document.getElementById('adminBtn').style.display='none'; document.getElementById('logoutBtn').style.display='inline-block'); alert("登录成功"); closeAdminModal(); } else { alert("密码错误"); } }
    function logout() { isAdmin=false; currentAdmin=null; localStorage.removeItem('currentAdmin'); document.querySelectorAll('.admin-only').forEach(el=>el.style.display='none'); document.getElementById('adminBtn').style.display='inline-block'; document.getElementById('logoutBtn').style.display='none'; alert("已退出"); }
    
    function bindEvents() {
        document.getElementById('startExamBtn').onclick = startExam;
        document.getElementById('prevBtn').onclick = () => prevQuestion();
        document.getElementById('nextBtn').onclick = () => nextQuestion();
        document.getElementById('submitBtn').onclick = submitExam;
        document.getElementById('startPracticeBtn').onclick = startPractice;
        document.getElementById('practicePrevBtn').onclick = () => prevPractice();
        document.getElementById('practiceNextBtn').onclick = () => nextPractice();
        document.getElementById('practiceViewResultBtn').onclick = showPracticeResult;
        document.getElementById('practiceAgainBtn').onclick = resetPractice;
        document.getElementById('importEmpBtn').onclick = () => showImportModal('employee');
        document.getElementById('importQuesBtn').onclick = () => showImportModal('question');
        document.getElementById('exportRecordBtn').onclick = exportRecords;
        document.getElementById('clearDataBtn').onclick = clearAllData;
        document.getElementById('resetDailyBtn').onclick = resetDaily;
        document.getElementById('saveSettingsBtn').onclick = saveSettings;
        document.getElementById('changePwdBtn').onclick = changePassword;
        document.getElementById('adminBtn').onclick = () => document.getElementById('adminLoginModal').style.display = 'flex';
        document.getElementById('logoutBtn').onclick = logout;
        document.getElementById('loginBtn').onclick = adminLogin;
        document.getElementById('closeAdminModalBtn').onclick = closeAdminModal;
        document.getElementById('confirmImportBtn').onclick = doImport;
        document.getElementById('closeModalBtn').onclick = closeModal;
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
                if (tab.dataset.tab === 'stats') renderRecords();
                if (tab.dataset.tab === 'manage') renderEmployees();
                if (tab.dataset.tab === 'questionBank') renderQuestions();
                if (tab.dataset.tab === 'records') renderRecords();
            };
        });
    }
    
    loadData();
    renderEmployees();
    renderQuestions();
    renderRecords();
    bindEvents();
</script>
</body>
</html>
