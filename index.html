<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选一选矿车间安全知识答题</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{margin:0;font-family:Arial,'Microsoft YaHei',sans-serif;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff;padding:18px 24px}.top b{font-size:24px}.wrap{max-width:1180px;margin:auto;padding:20px}.card{background:white;border:1px solid #dbe3ef;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 6px 18px #0f172a12}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}textarea{min-height:120px}button{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button.gray{background:#64748b}button.red{background:#dc2626}button.light{background:#eef2ff;color:#1e40af}.hide{display:none}.msg{padding:10px;border-radius:10px;background:#eff6ff;margin-top:10px}.q{border:1px solid #dbe3ef;border-radius:12px;padding:14px;margin:12px 0}.opt{display:block;border:1px solid #e2e8f0;border-radius:10px;margin:8px 0;padding:8px}.opt input{width:auto}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e2e8f0;padding:8px;text-align:left}.ok{color:#16a34a;font-weight:800}.bad{color:#dc2626;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><b>选一选矿车间安全知识答题</b><div>每日练习 · 安全知识 · 在线答题 · 成绩统计</div></div><div class="wrap"><section id="login" class="card"><h2>登录</h2><div class="grid"><div><label>身份</label><select id="role"><option value="emp">员工</option><option value="admin">管理员</option></select></div><div><label>姓名 / 管理员密码</label><input id="name" placeholder="员工输入姓名；管理员输入 admin123"></div></div><button onclick="login()" style="margin-top:12px">进入</button><button class="light" onclick="demo()">加载演示数据</button><div id="loginMsg" class="msg hide"></div></section><main id="app" class="hide"><div class="row"><button onclick="tab('home')">首页</button><button onclick="tab('exam')">开始答题</button><button onclick="tab('mine')">我的成绩</button><button id="adminBtn" onclick="tab('admin')">管理员</button><button class="gray" onclick="logout()">退出</button></div><section id="home" class="card page"><h2>首页</h2><p id="welcome"></p><p>题库：<b id="qCount">0</b> 题；员工名单：<b id="uCount">0</b> 人。</p></section><section id="exam" class="card page hide"><h2>安全知识答题</h2><div class="grid"><div><label>抽题数量</label><input id="num" type="number" value="10"></div><div><label>模式</label><select id="mode"><option value="daily">每日答题</option><option value="practice">练习模式</option></select></div></div><button onclick="start()" style="margin-top:12px">开始</button><button onclick="submitExam()" class="gray">提交</button><div id="paper"></div><div id="result"></div></section><section id="mine" class="card page hide"><h2>我的成绩</h2><button class="light" onclick="exportMine()">导出我的成绩</button><div id="mineBox"></div></section><section id="admin" class="card page hide"><h2>管理员</h2><h3>导入题库</h3><p>Excel/CSV表头：题型、题目、选项A、选项B、选项C、选项D、正确答案、所属分类、解析</p><input type="file" id="file"><button class="light" onclick="template()">下载题库模板</button><button class="red" onclick="clearBank()">清空题库</button><h3>员工白名单</h3><textarea id="users" placeholder="张三,生产部,操作工"></textarea><button onclick="saveUsers()">保存名单</button><h3>全部成绩</h3><button class="light" onclick="exportAll()">导出全部成绩</button><button class="red" onclick="clearRecords()">清空成绩</button><div id="allBox"></div></section></main></div><script>let bank=JSON.parse(localStorage.bank||'[]'),users=JSON.parse(localStorage.users||'[]'),records=JSON.parse(localStorage.records||'[]'),cur=[],me=null,admin=false;let $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function save(){localStorage.bank=JSON.stringify(bank);localStorage.users=JSON.stringify(users);localStorage.records=JSON.stringify(records)}function msg(t){$('loginMsg').textContent=t;$('loginMsg').classList.remove('hide')}function login(){let r=$('role').value,n=$('name').value.trim();admin=r==='admin';if(admin&&n!=='admin123')return msg('管理员密码错误');if(!admin&&!users.find(u=>u.name===n))return msg('姓名不在名单中，请联系管理员');me=admin?'管理员':n;$('login').classList.add('hide');$('app').classList.remove('hide');$('adminBtn').style.display=admin?'':'none';refresh();tab('home')}function logout(){location.reload()}function tab(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hide'));$(id).classList.remove('hide');refresh()}function refresh(){$('welcome').textContent='当前用户：'+me+(admin?'（管理员）':'');$('qCount').textContent=bank.length;$('uCount').textContent=users.length;$('users').value=users.map(u=>[u.name,u.dept,u.post].join(',')).join('\n');renderMine();renderAll()}function demo(){bank=[{type:'判断题',title:'进入生产现场必须正确佩戴安全帽。',opts:['正确','错误'],ans:'正确',cat:'基础安全',ana:'安全帽是基本防护用品。'},{type:'单选题',title:'发现事故隐患后应当怎么做？',opts:['A.立即报告并采取控制措施','B.继续作业','C.不处理','D.等待别人处理'],ans:'A',cat:'隐患排查',ana:'隐患应及时报告。'},{type:'多选题',title:'动火作业前应确认哪些内容？',opts:['A.办理作业票','B.清理易燃物','C.配置灭火器材','D.无需监护'],ans:'A,B,C',cat:'动火作业',ana:'动火必须审批、清理、配备消防器材。'}];users=[{name:'测试用户',dept:'选矿车间',post:'员工'}];save();msg('演示数据已加载，员工可用“测试用户”登录。')}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){if(!bank.length)return alert('请先导入题库');cur=shuffle(bank).slice(0,Math.min(+$('num').value||10,bank.length));$('paper').innerHTML=cur.map((q,i)=>'<div class=q><b>'+(i+1)+'.【'+esc(q.type)+'】'+esc(q.title)+'</b>'+q.opts.map(o=>'<label class=opt><input name=q'+i+' type='+(q.type.includes('多')?'checkbox':'radio')+' value="'+esc(o[0])+'"> '+esc(o)+'</label>').join('')+'</div>').join('');$('result').innerHTML=''}function ans(i){return [...document.querySelectorAll('[name=q'+i+']:checked')].map(x=>x.value).sort().join(',')}function submitExam(){if(!cur.length)return;let right=0,det=[];cur.forEach((q,i)=>{let a=ans(i),ok=a===q.ans.split(',').sort().join(',');if(ok)right++;det.push({title:q.title,user:a,ans:q.ans,ok})});let score=Math.round(right/cur.length*100),r={time:new Date().toLocaleString(),name:me,score,right,total:cur.length,mode:$('mode').value,det};records.unshift(r);save();$('result').innerHTML='<h3>得分：'+score+'分（'+right+'/'+cur.length+'）</h3>'+det.map(d=>'<p>'+esc(d.title)+'：'+(d.ok?'<span class=ok>正确</span>':'<span class=bad>错误</span>')+'，正确答案：'+esc(d.ans)+'</p>').join('');refresh()}function renderMine(){let rs=records.filter(r=>r.name===me);$('mineBox').innerHTML=table(rs)}function renderAll(){$('allBox').innerHTML=table(records)}function table(rs){return rs.length?'<table><tr><th>时间</th><th>姓名</th><th>模式</th><th>成绩</th></tr>'+rs.map(r=>'<tr><td>'+esc(r.time)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.mode)+'</td><td>'+r.score+'分</td></tr>').join('')+'</table>':'暂无记录'}function saveUsers(){users=$('users').value.split(/\n+/).map(l=>{let p=l.split(/[,，\t]/);return{name:(p[0]||'').trim(),dept:(p[1]||'').trim(),post:(p[2]||'').trim()}}).filter(u=>u.name);save();refresh()}$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});bank=rows.map(r=>({type:r['题型']||'单选题',title:r['题目'],opts:['选项A','选项B','选项C','选项D'].map(k=>r[k]).filter(Boolean).map((v,i)=>'ABCD'[i]+'.'+v),ans:String(r['正确答案']||'').trim(),cat:r['所属分类']||'',ana:r['解析']||''})).filter(q=>q.title&&q.ans);save();refresh();alert('导入成功：'+bank.length+'题')};function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')}function down(n,c){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download=n;a.click()}function exportAll(){down('选一选矿车间安全知识答题_全部成绩.csv',csv([['时间','姓名','模式','成绩'],...records.map(r=>[r.time,r.name,r.mode,r.score])]))}function exportMine(){down('选一选矿车间安全知识答题_我的成绩.csv',csv([['时间','姓名','模式','成绩'],...records.filter(r=>r.name===me).map(r=>[r.time,r.name,r.mode,r.score])]))}function template(){down('题库模板.csv',csv([['题型','题目','选项A','选项B','选项C','选项D','正确答案','所属分类','解析'],['单选题','发现隐患怎么办','立即报告','继续作业','不处理','等待','A','隐患排查','及时报告']]))}function clearBank(){if(confirm('清空题库？')){bank=[];save();refresh()}}function clearRecords(){if(confirm('清空成绩？')){records=[];save();refresh()}}</script></body></html>
