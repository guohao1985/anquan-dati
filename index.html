<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>企业安全教育培训考试系统 - 专业版</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* 头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { color: white; font-size: 1.8rem; }
        .header h1 small { font-size: 0.8rem; opacity: 0.8; }
        .admin-badge {
            background: #f59e0b;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .admin-badge:hover { background: #d97706; transform: scale(1.05); }
        
        /* 选项卡 */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab {
            padding: 12px 24px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
            font-weight: 500;
        }
        .tab.active { background: white; color: #2a5298; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .tab:hover:not(.active) { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        
        /* 卡片 */
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 15px;
        }
        .card-header h2 { color: #1e3c72; font-size: 1.5rem; }
        
        /* 按钮 */
        .btn { padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(30,60,114,0.4); }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-outline { background: white; border: 2px solid #1e3c72; color: #1e3c72; }
        
        /* 表格 */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f8fafc; font-weight: 600; color: #1e3c72; }
        tr:hover { background: #f1f5f9; }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80%;
            overflow-y: auto;
        }
        
        /* 考试区域 */
        .question-card {
            background: #f8fafc;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .options { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
        }
        .option:hover { border-color: #2a5298; background: #eff6ff; }
        .progress-bar { width: 100%; height: 10px; background: #e5e7eb; border-radius: 10px; overflow: hidden; margin: 20px 0; }
        .progress-fill { height: 100%; background: linear-gradient(135deg, #1e3c72, #2a5298); transition: width 0.3s; }
        
        /* 统计卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-number { font-size: 32px; font-weight: bold; }
        
        @media (max-width: 768px) {
            .card { padding: 15px; }
            .tab { padding: 8px 16px; font-size: 14px; }
            th, td { font-size: 12px; padding: 8px; }
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .alert { padding: 12px; border-radius: 10px; margin-bottom: 15px; }
        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏭 企业安全教育培训考试系统 <small>专业版</small></h1>
        <div class="admin-badge" id="adminBtn">👑 管理员登录</div>
    </div>
    
    <div class="tabs" id="tabs">
        <button class="tab active" data-tab="exam">📝 在线考试</button>
        <button class="tab" data-tab="manage">👥 员工管理</button>
        <button class="tab" data-tab="questionBank">📚 题库管理</button>
        <button class="tab" data-tab="records">📊 成绩记录</button>
        <button class="tab" data-tab="stats">📈 统计分析</button>
        <button class="tab admin-only" data-tab="admin" style="display:none;">⚙️ 系统设置</button>
    </div>
    
    <!-- 在线考试 -->
    <div id="exam" class="tab-content active">
        <div class="card">
            <div id="verifyPanel">
                <h2>员工身份验证</h2>
                <div class="form-group" style="margin-top:15px">
                    <label>工号</label>
                    <input type="text" id="empId" placeholder="请输入工号" style="width:100%; padding:12px">
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="empName" placeholder="请输入姓名" style="width:100%; padding:12px">
                </div>
                <button class="btn btn-primary" onclick="verifyAndStart()">开始考试</button>
            </div>
            <div id="examPanel" style="display:none">
                <div id="examHeader">
                    <h3 id="welcomeMsg"></h3>
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:20px">
                        <span>📋 第 <span id="qIndex">1</span> / <span id="qTotal">0</span> 题</span>
                        <span>⭐ 得分: <span id="curScore">0</span></span>
                        <span>⏱️ 剩余: <span id="timer">30:00</span></span>
                    </div>
                </div>
                <div id="questionArea"></div>
                <div style="display:flex; justify-content:space-between; margin-top:20px">
                    <button class="btn btn-outline" onclick="prevQ()">◀ 上一题</button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQ()">下一题 ▶</button>
                    <button class="btn btn-success" id="submitBtn" style="display:none" onclick="submitExam()">✅ 提交试卷</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 员工管理 -->
    <div id="manage" class="tab-content">
        <div class="card">
            <div class="card-header">
                <h2>👥 员工信息管理</h2>
                <div>
                    <button class="btn btn-primary" onclick="showImportModal('employee')">📤 导入Excel/JSON</button>
                    <button class="btn btn-success" onclick="exportData('employees')">📥 导出员工数据</button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead><tr><th>工号</th><th>姓名</th><th>部门</th><th>岗位</th><th>考试状态</th><th>操作</th></tr></thead>
                    <tbody id="employeeTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- 题库管理 -->
    <div id="questionBank" class="tab-content">
        <div class="card">
            <div class="card-header">
                <h2>📚 安全知识题库</h2>
                <div>
                    <button class="btn btn-primary" onclick="addQuestion()">➕ 手动添加</button>
                    <button class="btn btn-primary" onclick="showImportModal('question')">📤 批量导入题库</button>
                    <button class="btn btn-success" onclick="exportData('questions')">📥 导出题库</button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead><tr><th>序号</th><th>题目</th><th>选项A</th><th>选项B</th><th>选项C</th><th>选项D</th><th>答案</th><th>操作</th></tr></thead>
                    <tbody id="questionTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- 成绩记录 -->
    <div id="records" class="tab-content">
        <div class="card">
            <div class="card-header">
                <h2>📊 考试成绩记录</h2>
                <button class="btn btn-success" onclick="exportData('records')">📥 导出成绩单</button>
            </div>
            <div class="table-container">
                <table>
                    <thead><tr><th>工号</th><th>姓名</th><th>部门</th><th>得分</th><th>正确数</th><th>考试时间</th></tr></thead>
                    <tbody id="recordTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- 统计分析 -->
    <div id="stats" class="tab-content">
        <div class="card">
            <div class="card-header"><h2>📈 数据统计分析</h2></div>
            <div class="stats-grid" id="statsGrid"></div>
            <canvas id="scoreChart" style="max-height: 400px;"></canvas>
        </div>
    </div>
    
    <!-- 系统设置（管理员） -->
    <div id="admin" class="tab-content">
        <div class="card">
            <div class="card-header"><h2>⚙️ 系统设置</h2></div>
            <div class="form-group">
                <label>考试时间限制（分钟）</label>
                <input type="number" id="examTimeLimit" value="30" style="width:200px">
                <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
            </div>
            <hr style="margin:20px 0">
            <h3>数据管理</h3>
            <button class="btn btn-danger" onclick="clearAllData()">🗑️ 清空所有数据</button>
            <button class="btn btn-primary" onclick="backupData()">💾 备份数据</button>
            <button class="btn btn-primary" onclick="restoreData()">📂 恢复数据</button>
        </div>
    </div>
</div>

<!-- 导入模态框 -->
<div id="importModal" class="modal">
    <div class="modal-content">
        <h3 id="importTitle">导入数据</h3>
        <input type="file" id="importFile" accept=".json,.xlsx,.xls">
        <div style="margin-top:20px; display:flex; gap:10px">
            <button class="btn btn-primary" onclick="doImport()">导入</button>
            <button class="btn" onclick="closeModal()">取消</button>
        </div>
    </div>
</div>

<!-- 管理员登录模态框 -->
<div id="adminLoginModal" class="modal">
    <div class="modal-content">
        <h3>管理员登录</h3>
        <input type="password" id="adminPassword" placeholder="请输入管理员密码" style="width:100%; padding:12px; margin:15px 0">
        <button class="btn btn-primary" onclick="adminLogin()">登录</button>
        <button class="btn" onclick="closeAdminModal()">取消</button>
        <p style="margin-top:10px; font-size:12px; color:#999">默认密码: admin123</p>
    </div>
</div>

<script>
    // 全局数据
    let employees = JSON.parse(localStorage.getItem('employees') || '[]');
    let questions = JSON.parse(localStorage.getItem('questions') || getDefaultQuestions());
    let examRecords = JSON.parse(localStorage.getItem('examRecords') || '[]');
    let settings = JSON.parse(localStorage.getItem('settings') || '{"timeLimit":30}');
    let isAdmin = localStorage.getItem('isAdmin') === 'true';
    
    let currentExam = { emp: null, answers: [], curIndex: 0, timer: null, startTime: null };
    let chart = null;
    let importType = 'employee';
    
    // 默认题库
    function getDefaultQuestions() {
        return [
            { id: 1, text: '发现火情时，首先应该做什么？', options: ['立即灭火', '立即报警并疏散', '保护贵重物品', '等待领导指示'], answer: 1 },
            { id: 2, text: '安全帽的正确佩戴方式是？', options: ['随意戴在头上', '调整好内衬高度，系好下颏带', '反着戴', '只戴在头顶'], answer: 1 },
            { id: 3, text: '以下哪项属于不安全行为？', options: ['佩戴防护眼镜', '在禁烟区吸烟', '使用防护手套', '遵守操作规程'], answer: 1 },
            { id: 4, text: '遇到触电事故，首先应该？', options: ['直接用手拉触电者', '切断电源', '呼叫救护车', '用水泼'], answer: 1 },
            { id: 5, text: '安全生产方针是什么？', options: ['安全第一，预防为主', '效率第一', '质量第一', '效益第一'], answer: 0 }
        ];
    }
    
    function saveAll() {
        localStorage.setItem('employees', JSON.stringify(employees));
        localStorage.setItem('questions', JSON.stringify(questions));
        localStorage.setItem('examRecords', JSON.stringify(examRecords));
        localStorage.setItem('settings', JSON.stringify(settings));
    }
    
    // 渲染员工表
    function renderEmployees() {
        const tbody = document.getElementById('employeeTable');
        if(!tbody) return;
        tbody.innerHTML = employees.map(emp => {
            const hasExam = examRecords.some(r => r.employeeId === emp.id);
            return `<tr>
                <td>${emp.id}</td><td>${emp.name}</td><td>${emp.dept || '-'}</td><td>${emp.position || '-'}</td>
                <td>${hasExam ? '✅ 已完成' : '⏳ 未考试'}</td>
                <td><button class="btn btn-danger" onclick="deleteEmployee('${emp.id}')">删除</button></td>
            </tr>`;
        }).join('');
    }
    
    // 渲染题库
    function renderQuestions() {
        const tbody = document.getElementById('questionTable');
        if(!tbody) return;
        tbody.innerHTML = questions.map((q, idx) => `
            <tr>
                <td>${idx+1}</td><td>${q.text}</td>
                <td>${q.options[0]}</td><td>${q.options[1]}</td>
                <td>${q.options[2]}</td><td>${q.options[3]}</td>
                <td>${String.fromCharCode(65+q.answer)}</td>
                <td><button class="btn btn-danger" onclick="deleteQuestion(${q.id})">删除</button></td>
            </tr>
        `).join('');
    }
    
    // 渲染成绩
    function renderRecords() {
        const tbody = document.getElementById('recordTable');
        if(!tbody) return;
        tbody.innerHTML = examRecords.map(r => `
            <tr><td>${r.employeeId}</td><td>${r.employeeName}</td><td>${r.department}</td>
            <td><strong>${r.score.toFixed(1)}</strong></td><td>${r.correctCount}/${r.totalCount}</td><td>${r.examTime}</td></tr>
        `).join('');
    }
    
    // 统计
    function updateStats() {
        const totalEmp = employees.length;
        const totalExam = examRecords.length;
        const avgScore = totalExam > 0 ? (examRecords.reduce((s,r)=>s+r.score,0)/totalExam).toFixed(1) : 0;
        const passCount = examRecords.filter(r=>r.score>=60).length;
        const passRate = totalExam > 0 ? ((passCount/totalExam)*100).toFixed(1) : 0;
        const completion = totalEmp > 0 ? ((totalExam/totalEmp)*100).toFixed(1) : 0;
        
        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><div class="stat-number">${totalEmp}</div><div>总员工数</div></div>
            <div class="stat-card"><div class="stat-number">${totalExam}</div><div>已完成考试</div></div>
            <div class="stat-card"><div class="stat-number">${avgScore}</div><div>平均分</div></div>
            <div class="stat-card"><div class="stat-number">${passRate}%</div><div>及格率</div></div>
            <div class="stat-card"><div class="stat-number">${completion}%</div><div>完成率</div></div>
        `;
        
        if(chart) chart.destroy();
        const ctx = document.getElementById('scoreChart').getContext('2d');
        const ranges = [0,20,40,60,80,100];
        const counts = ranges.map((r,i)=>{
            if(i===ranges.length-1) return examRecords.filter(rr=>rr.score>=ranges[i]).length;
            return examRecords.filter(rr=>rr.score>=ranges[i] && rr.score<ranges[i+1]).length;
        });
        chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['0-20','20-40','40-60','60-80','80-100'], datasets: [{ label: '人数', data: counts.slice(0,5), backgroundColor: '#2a5298' }] }
        });
    }
    
    // 考试逻辑
    function verifyAndStart() {
        const id = document.getElementById('empId').value.trim();
        const name = document.getElementById('empName').value.trim();
        const emp = employees.find(e=>e.id===id && e.name===name);
        if(!emp) { alert('验证失败！工号或姓名错误'); return; }
        if(examRecords.some(r=>r.employeeId===id)) { alert('您已完成考试，不能重复参加！'); return; }
        
        currentExam.emp = emp;
        currentExam.answers = new Array(questions.length).fill(null);
        currentExam.curIndex = 0;
        
        document.getElementById('verifyPanel').style.display = 'none';
        document.getElementById('examPanel').style.display = 'block';
        document.getElementById('welcomeMsg').innerHTML = `欢迎 ${emp.name} (${emp.dept || ''}) 参加安全考试`;
        document.getElementById('qTotal').innerText = questions.length;
        
        // 倒计时
        let timeLeft = (settings.timeLimit || 30) * 60;
        if(currentExam.timer) clearInterval(currentExam.timer);
        const timerInterval = setInterval(()=>{
            let min = Math.floor(timeLeft/60);
            let sec = timeLeft%60;
            document.getElementById('timer').innerText = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
            if(timeLeft<=0) { clearInterval(timerInterval); alert('时间到！自动交卷'); submitExam(); }
            timeLeft--;
        },1000);
        currentExam.timer = timerInterval;
        renderCurrentQuestion();
    }
    
    function renderCurrentQuestion() {
        const q = questions[currentExam.curIndex];
        let html = `<div class="question-card"><h3>${currentExam.curIndex+1}. ${q.text}</h3><div class="options">`;
        q.options.forEach((opt,idx)=>{
            const checked = currentExam.answers[currentExam.curIndex] === idx ? 'checked' : '';
            html += `<label class="option"><input type="radio" name="q" value="${idx}" ${checked} onchange="saveAnswer(${idx})"> ${String.fromCharCode(65+idx)}. ${opt}</label>`;
        });
        html += `</div></div>`;
        document.getElementById('questionArea').innerHTML = html;
        document.getElementById('qIndex').innerText = currentExam.curIndex+1;
        document.getElementById('progressFill').style.width = `${((currentExam.curIndex+1)/questions.length)*100}%`;
        
        const isLast = currentExam.curIndex === questions.length-1;
        document.getElementById('nextBtn').style.display = isLast ? 'none' : 'inline-block';
        document.getElementById('submitBtn').style.display = isLast ? 'inline-block' : 'none';
    }
    
    function saveAnswer(ans) { currentExam.answers[currentExam.curIndex] = ans; }
    function nextQ() { if(currentExam.curIndex < questions.length-1) { currentExam.curIndex++; renderCurrentQuestion(); } }
    function prevQ() { if(currentExam.curIndex > 0) { currentExam.curIndex--; renderCurrentQuestion(); } }
    
    function submitExam() {
        if(currentExam.timer) clearInterval(currentExam.timer);
        let correct = 0;
        currentExam.answers.forEach((ans,idx)=>{ if(ans!==null && ans===questions[idx].answer) correct++; });
        const score = (correct/questions.length)*100;
        const record = {
            employeeId: currentExam.emp.id,
            employeeName: currentExam.emp.name,
            department: currentExam.emp.dept || '',
            score: score,
            correctCount: correct,
            totalCount: questions.length,
            examTime: new Date().toLocaleString()
        };
        examRecords.push(record);
        saveAll();
        alert(`考试完成！得分：${score.toFixed(1)}分 (${correct}/${questions.length})`);
        document.getElementById('verifyPanel').style.display = 'block';
        document.getElementById('examPanel').style.display = 'none';
        document.getElementById('empId').value = '';
        document.getElementById('empName').value = '';
        renderEmployees();
        renderRecords();
        updateStats();
    }
    
    // 导入导出
    function showImportModal(type) { importType = type; document.getElementById('importTitle').innerText = type==='employee'?'导入员工名单':'导入题库'; document.getElementById('importModal').style.display='flex'; }
    function closeModal() { document.getElementById('importModal').style.display='none'; }
    function doImport() {
        const file = document.getElementById('importFile').files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                let data;
                if(file.name.endsWith('.json')) data = JSON.parse(e.target.result);
                else {
                    const workbook = XLSX.read(e.target.result, {type:'array'});
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    data = XLSX.utils.sheet_to_json(sheet);
                }
                if(importType === 'employee') {
                    employees = data.map((row,i)=>({ id: row.id || row.工号 || String(i+1).padStart(3,'0'), name: row.name || row.姓名, dept: row.dept || row.部门 || '', position: row.position || row.岗位 || '' }));
                } else {
                    const newQuestions = data.map((row,idx)=>({ id: questions.length+idx+1, text: row.题目 || row.text, options: [row.A,row.B,row.C,row.D], answer: ['A','B','C','D'].indexOf(row.答案 || row.answer) }));
                    questions.push(...newQuestions);
                }
                saveAll();
                renderEmployees(); renderQuestions(); updateStats();
                alert('导入成功！');
                closeModal();
            } catch(err) { alert('导入失败：'+err.message); }
        };
        if(file.name.endsWith('.xlsx')||file.name.endsWith('.xls')) reader.readAsArrayBuffer(file);
        else reader.readAsText(file);
    }
    
    function exportData(type) {
        let data, filename;
        if(type === 'employees') { data = employees; filename = '员工数据.json'; }
        else if(type === 'questions') { data = questions.map(q=>({题目:q.text, A:q.options[0], B:q.options[1], C:q.options[2], D:q.options[3], 答案:String.fromCharCode(65+q.answer)})); filename = '题库.json'; }
        else { data = examRecords; filename = '考试成绩.json'; }
        const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(a.href);
    }
    
    function deleteEmployee(id) { employees = employees.filter(e=>e.id!==id); saveAll(); renderEmployees(); updateStats(); }
    function deleteQuestion(id) { questions = questions.filter(q=>q.id!==id); saveAll(); renderQuestions(); }
    function addQuestion() {
        const text = prompt('题目：'); if(!text) return;
        let opts = [];
        for(let i=0;i<4;i++) { let o = prompt(`选项${String.fromCharCode(65+i)}：`); if(!o) return; opts.push(o); }
        let ans = prompt('答案(A/B/C/D)：').toUpperCase(); let ansIdx = ans.charCodeAt(0)-65;
        questions.push({ id: Date.now(), text, options: opts, answer: ansIdx });
        saveAll(); renderQuestions();
    }
    
    // 管理员
    function adminLogin() {
        const pwd = document.getElementById('adminPassword').value;
        if(pwd === 'admin123') { isAdmin=true; localStorage.setItem('isAdmin','true'); document.querySelectorAll('.admin-only').forEach(el=>el.style.display='inline-block'); alert('登录成功！'); closeAdminModal(); renderEmployees(); }
        else alert('密码错误！');
    }
    function closeAdminModal() { document.getElementById('adminLoginModal').style.display='none'; }
    function saveSettings() { settings.timeLimit = parseInt(document.getElementById('examTimeLimit').value); saveAll(); alert('设置已保存'); }
    function clearAllData() { if(confirm('⚠️ 清空所有数据不可恢复！')){ employees=[]; questions=getDefaultQuestions(); examRecords=[]; saveAll(); renderEmployees(); renderQuestions(); renderRecords(); updateStats(); alert('已清空'); } }
    function backupData() { exportData('employees'); setTimeout(()=>exportData('questions'),100); setTimeout(()=>exportData('records'),200); }
    function restoreData() { alert('请导入之前备份的JSON文件'); showImportModal('employee'); }
    
    // 选项卡切换
    document.querySelectorAll('.tab').forEach(tab=>{
        tab.addEventListener('click',()=>{
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab).classList.add('active');
            if(tab.dataset.tab === 'stats') updateStats();
        });
    });
    document.getElementById('adminBtn').onclick = ()=>{ document.getElementById('adminLoginModal').style.display='flex'; };
    if(isAdmin) document.querySelectorAll('.admin-only').forEach(el=>el.style.display='inline-block');
    
    renderEmployees(); renderQuestions(); renderRecords(); updateStats();
</script>
</body>
</html>
