<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>企业安全教育培训考试系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* 容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 卡片样式 */
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 70px rgba(0,0,0,0.15);
        }

        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: white;
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            color: rgba(255,255,255,0.9);
            font-size: 1em;
        }

        /* 按钮样式 */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        /* 表格 */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            font-weight: 600;
            color: #333;
        }

        tr:hover {
            background: #f9fafb;
        }

        /* 选项卡 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: white;
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 题目卡片 */
        .question-item {
            background: #f9fafb;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #333;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option:hover {
            background: #e0e7ff;
        }

        .option input {
            width: auto;
            margin-right: 10px;
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80%;
            overflow-y: auto;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }
            
            .btn {
                padding: 10px 16px;
                font-size: 14px;
            }
            
            th, td {
                font-size: 12px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏢 企业安全教育培训考试系统</h1>
            <p>安全生产 | 规范操作 | 应急处理 | 事故预防</p>
        </div>

        <!-- 选项卡 -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('exam')">📝 在线考试</button>
            <button class="tab" onclick="switchTab('manage')">👥 员工管理</button>
            <button class="tab" onclick="switchTab('questions')">📚 题库管理</button>
            <button class="tab" onclick="switchTab('records')">📊 成绩记录</button>
            <button class="tab" onclick="switchTab('stats')">📈 统计分析</button>
        </div>

        <!-- 在线考试 -->
        <div id="exam" class="tab-content active">
            <div class="card">
                <div id="employeeVerify">
                    <h3>员工身份验证</h3>
                    <div class="form-group">
                        <label>工号</label>
                        <input type="text" id="employeeId" placeholder="请输入您的工号" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" id="employeeName" placeholder="请输入您的姓名" autocomplete="off">
                    </div>
                    <button class="btn btn-primary" onclick="verifyEmployee()">开始考试</button>
                </div>
                
                <div id="examArea" style="display:none;">
                    <div id="examHeader">
                        <h3 id="welcomeMsg"></h3>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                            <span>第 <span id="currentQ">1</span> / <span id="totalQ">0</span> 题</span>
                            <span>得分: <span id="scoreDisplay">0</span></span>
                            <span>剩余时间: <span id="timer">00:00</span></span>
                        </div>
                    </div>
                    <div id="questionArea"></div>
                    <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                        <button class="btn" onclick="prevQuestion()">上一题</button>
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">下一题</button>
                        <button class="btn btn-success" id="submitBtn" style="display:none;" onclick="submitExam()">提交试卷</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 员工管理 -->
        <div id="manage" class="tab-content">
            <div class="card">
                <h3>👥 员工信息管理</h3>
                <div class="form-group">
                    <button class="btn btn-primary" onclick="showImportModal()">📤 导入员工名单(Excel/JSON)</button>
                    <button class="btn btn-success" onclick="downloadEmployeeTemplate()">📥 下载模板</button>
                </div>
                <div class="table-container">
                    <table id="employeeTable">
                        <thead>
                            <tr><th>工号</th><th>姓名</th><th>部门</th><th>岗位</th><th>操作</th></tr>
                        </thead>
                        <tbody id="employeeList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 题库管理 -->
        <div id="questions" class="tab-content">
            <div class="card">
                <h3>📚 安全知识题库</h3>
                <button class="btn btn-primary" onclick="addQuestion()">➕ 添加题目</button>
                <div class="table-container">
                    <table id="questionTable">
                        <thead><tr><th>序号</th><th>题目</th><th>选项</th><th>正确答案</th><th>操作</th></tr></thead>
                        <tbody id="questionList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 成绩记录 -->
        <div id="records" class="tab-content">
            <div class="card">
                <h3>📊 考试成绩记录</h3>
                <div class="table-container">
                    <table id="recordTable">
                        <thead><tr><th>工号</th><th>姓名</th><th>部门</th><th>得分</th><th>正确率</th><th>考试时间</th></tr></thead>
                        <tbody id="recordList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 统计分析 -->
        <div id="stats" class="tab-content">
            <div class="card">
                <h3>📈 数据统计分析</h3>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-number" id="totalEmployees">0</div><div class="stat-label">总员工数</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalExams">0</div><div class="stat-label">已完成考试</div></div>
                    <div class="stat-card"><div class="stat-number" id="avgScore">0</div><div class="stat-label">平均分</div></div>
                    <div class="stat-card"><div class="stat-number" id="passRate">0</div><div class="stat-label">及格率(≥60分)</div></div>
                </div>
                <canvas id="scoreChart" style="max-height: 400px;"></canvas>
            </div>
        </div>
    </div>

    <!-- 导入模态框 -->
    <div id="importModal" class="modal">
        <div class="modal-content">
            <h3>导入员工名单</h3>
            <div class="form-group">
                <label>选择文件 (Excel/JSON)</label>
                <input type="file" id="importFile" accept=".json,.xlsx,.xls">
            </div>
            <button class="btn btn-primary" onclick="importEmployees()">导入</button>
            <button class="btn" onclick="closeModal()">取消</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // 初始化数据
        let employees = JSON.parse(localStorage.getItem('employees') || '[]');
        let questions = JSON.parse(localStorage.getItem('questions') || getDefaultQuestions());
        let examRecords = JSON.parse(localStorage.getItem('examRecords') || '[]');
        
        let currentExam = { employee: null, answers: [], currentIndex: 0, score: 0, startTime: null, timer: null };
        
        // 默认题库
        function getDefaultQuestions() {
            return [
                { id: 1, text: '发现火情时，首先应该做什么？', options: ['A. 立即灭火', 'B. 立即报警并疏散', 'C. 保护贵重物品', 'D. 等待领导指示'], answer: 1 },
                { id: 2, text: '安全帽的正确佩戴方式是？', options: ['A. 随意戴在头上', 'B. 调整好内衬高度，系好下颏带', 'C. 反着戴', 'D. 只戴在头顶'], answer: 1 },
                { id: 3, text: '以下哪项属于不安全行为？', options: ['A. 佩戴防护眼镜', 'B. 在禁烟区吸烟', 'C. 使用防护手套', 'D. 遵守操作规程'], answer: 1 },
                { id: 4, text: '遇到触电事故，首先应该？', options: ['A. 直接用手拉触电者', 'B. 切断电源', 'C. 呼叫救护车', 'D. 用水泼'], answer: 1 },
                { id: 5, text: '安全生产方针是什么？', options: ['A. 安全第一，预防为主', 'B. 效率第一', 'C. 质量第一', 'D. 效益第一'], answer: 0 }
            ];
        }
        
        // 保存数据
        function saveData() {
            localStorage.setItem('employees', JSON.stringify(employees));
            localStorage.setItem('questions', JSON.stringify(questions));
            localStorage.setItem('examRecords', JSON.stringify(examRecords));
        }
        
        // 切换选项卡
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'manage') renderEmployeeList();
            if (tabName === 'questions') renderQuestionList();
            if (tabName === 'records') renderRecordList();
            if (tabName === 'stats') updateStatistics();
        }
        
        // 验证员工
        function verifyEmployee() {
            const id = document.getElementById('employeeId').value.trim();
            const name = document.getElementById('employeeName').value.trim();
            
            const employee = employees.find(e => e.id === id && e.name === name);
            if (!employee) {
                alert('员工验证失败！请检查工号和姓名是否正确');
                return;
            }
            
            // 检查是否已经考过试
            const hasExam = examRecords.some(r => r.employeeId === id);
            if (hasExam) {
                alert('您已完成考试，不能重复参加！');
                return;
            }
            
            currentExam.employee = employee;
            currentExam.answers = new Array(questions.length).fill(null);
            currentExam.currentIndex = 0;
            currentExam.score = 0;
            currentExam.startTime = Date.now();
            
            document.getElementById('employeeVerify').style.display = 'none';
            document.getElementById('examArea').style.display = 'block';
            document.getElementById('welcomeMsg').innerHTML = `欢迎 ${employee.name} (${employee.dept}) 参加安全考试`;
            document.getElementById('totalQ').innerText = questions.length;
            
            startTimer(30 * 60); // 30分钟倒计时
            renderQuestion();
        }
        
        // 开始计时
        function startTimer(seconds) {
            if (currentExam.timer) clearInterval(currentExam.timer);
            let timeLeft = seconds;
            
            function updateTimer() {
                const minutes = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').innerText = `${String(minutes).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(currentExam.timer);
                    alert('时间到！系统将自动提交试卷');
                    submitExam();
                }
                timeLeft--;
            }
            
            updateTimer();
            currentExam.timer = setInterval(updateTimer, 1000);
        }
        
        // 渲染题目
        function renderQuestion() {
            const q = questions[currentExam.currentIndex];
            const selected = currentExam.answers[currentExam.currentIndex];
            
            let html = `<div class="question-item"><div class="question-text">${currentExam.currentIndex + 1}. ${q.text}</div><div class="options">`;
            q.options.forEach((opt, idx) => {
                html += `<label class="option"><input type="radio" name="answer" value="${idx}" ${selected === idx ? 'checked' : ''} onchange="saveAnswer(${idx})"> ${opt}</label>`;
            });
            html += `</div></div>`;
            
            document.getElementById('questionArea').innerHTML = html;
            document.getElementById('currentQ').innerText = currentExam.currentIndex + 1;
            document.getElementById('progressFill').style.width = `${((currentExam.currentIndex + 1) / questions.length) * 100}%`;
            
            const nextBtn = document.getElementById('nextBtn');
            const submitBtn = document.getElementById('submitBtn');
            
            if (currentExam.currentIndex === questions.length - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'inline-block';
            } else {
                nextBtn.style.display = 'inline-block';
                submitBtn.style.display = 'none';
            }
        }
        
        function saveAnswer(answerIndex) {
            currentExam.answers[currentExam.currentIndex] = answerIndex;
        }
        
        function nextQuestion() {
            if (currentExam.currentIndex < questions.length - 1) {
                currentExam.currentIndex++;
                renderQuestion();
            }
        }
        
        function prevQuestion() {
            if (currentExam.currentIndex > 0) {
                currentExam.currentIndex--;
                renderQuestion();
            }
        }
        
        function submitExam() {
            if (currentExam.timer) clearInterval(currentExam.timer);
            
            // 计算得分
            let score = 0;
            currentExam.answers.forEach((answer, idx) => {
                if (answer !== null && answer === questions[idx].answer) {
                    score++;
                }
            });
            
            const scorePercent = (score / questions.length) * 100;
            
            const record = {
                employeeId: currentExam.employee.id,
                employeeName: currentExam.employee.name,
                department: currentExam.employee.dept,
                score: scorePercent,
                correctCount: score,
                totalCount: questions.length,
                examTime: new Date().toLocaleString(),
                answers: currentExam.answers
            };
            
            examRecords.push(record);
            saveData();
            
            alert(`考试完成！得分：${scorePercent.toFixed(1)}分 (${score}/${questions.length})`);
            
            // 重置考试界面
            document.getElementById('employeeVerify').style.display = 'block';
            document.getElementById('examArea').style.display = 'none';
            document.getElementById('employeeId').value = '';
            document.getElementById('employeeName').value = '';
            
            renderRecordList();
            updateStatistics();
        }
        
        // 员工管理
        function renderEmployeeList() {
            const tbody = document.getElementById('employeeList');
            tbody.innerHTML = employees.map(emp => `
                <tr><td>${emp.id}</td><td>${emp.name}</td><td>${emp.dept}</td><td>${emp.position || '-'}</td>
                <td><button class="btn btn-danger" onclick="deleteEmployee('${emp.id}')">删除</button></td></tr>
            `).join('');
        }
        
        function deleteEmployee(id) {
            employees = employees.filter(e => e.id !== id);
            saveData();
            renderEmployeeList();
            updateStatistics();
        }
        
        function showImportModal() {
            document.getElementById('importModal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('importModal').style.display = 'none';
        }
        
        function importEmployees() {
            const file = document.getElementById('importFile').files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) {
                        employees = data;
                        saveData();
                        renderEmployeeList();
                        updateStatistics();
                        alert(`成功导入 ${data.length} 名员工`);
                    }
                } catch(err) {
                    alert('文件格式错误，请使用JSON格式');
                }
                closeModal();
            };
            reader.readAsText(file);
        }
        
        function downloadEmployeeTemplate() {
            const template = [{ id: '001', name: '张三', dept: '生产部', position: '操作工' }];
            const dataStr = JSON.stringify(template, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'employee_template.json';
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // 题库管理
        function renderQuestionList() {
            const tbody = document.getElementById('questionList');
            tbody.innerHTML = questions.map((q, idx) => `
                <tr><td>${idx+1}</td><td>${q.text}</td><td>${q.options.join(' | ')}</td><td>${String.fromCharCode(65+q.answer)}</td>
                <td><button class="btn btn-danger" onclick="deleteQuestion(${q.id})">删除</button></td></tr>
            `).join('');
        }
        
        function addQuestion() {
            const text = prompt('请输入题目：');
            if (!text) return;
            const options = [];
            for(let i=0; i<4; i++) {
                const opt = prompt(`请输入选项 ${String.fromCharCode(65+i)}：`);
                if(!opt) return;
                options.push(opt);
            }
            const answer = prompt('请输入正确答案(A/B/C/D)：').toUpperCase();
            const answerIndex = answer.charCodeAt(0) - 65;
            
            const newId = Math.max(...questions.map(q => q.id), 0) + 1;
            questions.push({ id: newId, text, options, answer: answerIndex });
            saveData();
            renderQuestionList();
        }
        
        function deleteQuestion(id) {
            if(confirm('确定删除此题吗？')) {
                questions = questions.filter(q => q.id !== id);
                saveData();
                renderQuestionList();
            }
        }
        
        // 成绩记录
        function renderRecordList() {
            const tbody = document.getElementById('recordList');
            tbody.innerHTML = examRecords.map(r => `
                <tr><td>${r.employeeId}</td><td>${r.employeeName}</td><td>${r.department}</td>
                <td>${r.score.toFixed(1)}</td><td>${r.correctCount}/${r.totalCount}</td><td>${r.examTime}</td></tr>
            `).join('');
        }
        
        // 统计分析
        function updateStatistics() {
            document.getElementById('totalEmployees').innerText = employees.length;
            document.getElementById('totalExams').innerText = examRecords.length;
            
            const avgScore = examRecords.length > 0 
                ? (examRecords.reduce((sum, r) => sum + r.score, 0) / examRecords.length).toFixed(1)
                : 0;
            document.getElementById('avgScore').innerText = avgScore;
            
            const passCount = examRecords.filter(r => r.score >= 60).length;
            const passRate = examRecords.length > 0 ? ((passCount / examRecords.length) * 100).toFixed(1) : 0;
            document.getElementById('passRate').innerText = passRate + '%';
        }
        
        // 初始化渲染
        renderEmployeeList();
        renderQuestionList();
        renderRecordList();
        updateStatistics();
        
        // 点击模态框外部关闭
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                closeModal();
            }
        }
    </script>
</body>
</html>
